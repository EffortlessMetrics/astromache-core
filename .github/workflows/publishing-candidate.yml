name: Static publication candidate
on:
  push:
    branches: [feat/static-publication-20261109]
permissions:
  contents: read
concurrency:
  group: static-publication-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record exact tested source and retain a local qualification fixture
        run: |
          mkdir -p publishing-evidence
          git rev-parse HEAD > publishing-evidence/source.txt
          git rev-parse HEAD^{tree} >> publishing-evidence/source.txt
          node --version >> publishing-evidence/source.txt
          pnpm --version >> publishing-evidence/source.txt
          git archive --format=tar HEAD | gzip > publishing-evidence/source.tar.gz
          cp "$(command -v node)" ./qualification-node
          tar -czf publishing-evidence/qualification-runtime.tgz node_modules packages/astromache/node_modules qualification-node
          rm qualification-node
          sha256sum publishing-evidence/*.gz publishing-evidence/*.tgz >> publishing-evidence/source.txt
      - name: Real parser, metadata, negotiation and filesystem regressions
        run: node --test scripts/publishing-*.test.mjs
      - name: Independently installed package, actual Astro and offline integration
        run: node scripts/verify-static-publication.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: static-publication-${{ github.sha }}
          path: publishing-evidence/
          if-no-files-found: error
          retention-days: 14
