name: Finalize static publication candidate
on:
  push:
    branches: [feat/static-publication-20261109]
permissions:
  contents: read
concurrency:
  group: static-publication-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply reviewed changes and remove this one-time preparation workflow
        run: |
          python3 scripts/finalize-static-publication.py
          git rm scripts/finalize-static-publication.py .github/workflows/publishing-candidate.yml
          git diff --check
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add README.md package.json packages/astromache scripts/publishing-*.test.mjs scripts/verify-static-publication.mjs scripts/verify-packed-consumers.mjs .github/workflows/qualification.yml
          git commit -m "Complete static publishing contracts and package qualification"
          git push origin HEAD:refs/heads/feat/static-publication-20261109
      - name: Record exact tested source
        run: |
          mkdir -p publishing-evidence
          git rev-parse HEAD > publishing-evidence/source.txt
          git rev-parse HEAD^{tree} >> publishing-evidence/source.txt
          node --version >> publishing-evidence/source.txt
          pnpm --version >> publishing-evidence/source.txt
          git archive --format=tar HEAD | gzip > publishing-evidence/source.tar.gz
      - run: pnpm verify:publication:static
      - run: pnpm verify:publication:packed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: static-publication-${{ github.sha }}
          path: publishing-evidence/
          if-no-files-found: error
          retention-days: 14
